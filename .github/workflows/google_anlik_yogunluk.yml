name: "GEOPROP Google anlık yoğunluk (saatlik ölçüm + işletme kaydı, 6 makine)"

# Google'ın canlı yoğunluk değeri yalnız o an görünür; geçmişi geri alınamaz. Bu iş akışı seçili ~9.000 işletmeyi
# (Batı büyükşehirleri + Ankara; AVM, gece hayatı, restoran, kafe, market, otel, spor, hizmet, ulaşım) ölçer.
# 11 Eki 2026: HER SAAT çalışır; liste 7 parçaya bölünür, her saat sıradaki parça ölçülür → her işletme 7 günde günün 24 saatinin
# hepsinde ölçülür (eski düzende 6 sabit saatin sabah olanları GitHub gecikmesiyle hiç çalışmıyordu: 05–12 TR neredeyse boştu).
# Her ölçümde işletmenin o anki Google kaydı da zaman damgasıyla yazılır (google_place_anlik_kayit: puan, yorum sayısı, açık/kapalı,
# saatler, adres, telefon, web sitesi …; yorum yazanların adları alınmaz).
# Ağır 40'lık iş akışları en fazla 34 makine kullanır; 6 yer bu ölçüme ayrılmıştır.
# 14 Eki 2026: GitHub '23 * * * *' zamanlamasının çoğunu atlıyordu (günde 24 yerine 3–4 koşu). Artık her koşu bitince
# sonraki saatin :23'ünü bekleyip bir sonrakini kendisi başlatır (zincir); cron yalnız zincir koparsa yeniden başlatan
# yedektir. "kapı" işi: aynı UTC saatinde açılan koşulardan yalnız ilki ölçer, diğerleri hemen kapanır (çift ölçüm olmaz).

on:
  # Tarayıcı yöntemi 3 Eki 2026 bulut denemesinde doğrulandı (6/6 makine tam görünüm, ölçümlerin %58'inde canlı değer).
  schedule:
    - cron: '23 * * * *'   # her saat :23 (saat başı GitHub'da saatlerce gecikiyordu); kaçan saatleri 7'li döngü telafi eder
  workflow_dispatch:
    inputs:
      yontem:
        description: 'tarayici (Playwright, önerilen) · istek (eski, yoğunluğu nadiren verir)'
        required: false
        default: 'tarayici'
      limit:
        description: '(Test) makine başına en fazla N işletme (boş = süre bitene kadar)'
        required: false
        default: ''
      max_saniye:
        description: 'Makine başına azami ölçüm süresi (saniye)'
        required: false
        default: '2400'
      hedef_yenile:
        description: 'Hedef listesini ana ambardan yeniden üret (true/false)'
        required: false
        default: 'false'
      zincir:
        description: 'Bitince sonraki saatin koşusunu başlat (true/false; test için false)'
        required: false
        default: 'true'

permissions:
  contents: write
  actions: write   # zincir: sonraki koşuyu workflow_dispatch ile başlatır

concurrency:
  group: geoprop-anlik-yogunluk
  cancel-in-progress: false

env:
  AMBAR_RELEASE: warehouse-latest
  GH_TOKEN: ${{ github.token }}
  HEDEF: anlik_yogunluk_hedef.csv

jobs:
  kapi:
    name: "Kapı (bu saatin ilk koşusu mu?)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      calis: ${{ steps.k.outputs.calis }}
    steps:
      - id: k
        run: |
          # Bu koşunun açıldığı UTC saati; o saatte açılmış (iptal edilmemiş) koşulardan en eskisi ölçer.
          RUN_CREATED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -q .created_at)
          SAAT=${RUN_CREATED:0:13}
          ILK=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/google_anlik_yogunluk.yml/runs?created=%3E%3D${SAAT}:00:00Z&per_page=100" \
                -q "[.workflow_runs[] | select(.created_at[0:13] == \"$SAAT\") | select(.conclusion != \"cancelled\")] | sort_by(.created_at, .id) | .[0].id")
          echo "koşu $GITHUB_RUN_ID · açılış $RUN_CREATED · bu saatin ilk koşusu $ILK"
          if [ "$ILK" = "$GITHUB_RUN_ID" ] || [ -z "$ILK" ]; then echo "calis=true" >> "$GITHUB_OUTPUT"
          else echo "calis=false" >> "$GITHUB_OUTPUT"; echo "### Bu saat zaten ölçülüyor (koşu $ILK) — bu koşu atlandı" >> "$GITHUB_STEP_SUMMARY"; fi

  hedef:
    name: "Hedef listesi"
    needs: [kapi]
    if: ${{ needs.kapi.outputs.calis == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Hedef listesini indir (yoksa ana ambardan üret ve release'e koy)
        run: |
          mkdir -p hedef
          if [ "${{ github.event.inputs.hedef_yenile }}" != "true" ] && \
             gh release download "$AMBAR_RELEASE" --pattern "${HEDEF}.gz" --dir hedef --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
            gunzip -f "hedef/${HEDEF}.gz"
          else
            mkdir -p warehouse/master
            ops/ambar_indir.sh google_places_ve_yogunluk.sqlite warehouse/master
            python collector/google_anlik_hedef.py --ambar warehouse/master/google_places_ve_yogunluk.sqlite --out "hedef/${HEDEF}"
            gzip -c "hedef/${HEDEF}" > "/tmp/${HEDEF}.gz"
            gh release upload "$AMBAR_RELEASE" "/tmp/${HEDEF}.gz" --clobber --repo "$GITHUB_REPOSITORY"
          fi
          echo "hedef: $(($(wc -l < hedef/${HEDEF}) - 1)) işletme"
      - uses: actions/upload-artifact@v4
        with:
          name: anlik-hedef
          path: hedef/${{ env.HEDEF }}
          retention-days: 1

  olcum:
    name: "Ölçüm ${{ matrix.shard }}/6"
    needs: [hedef]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: anlik-hedef
          path: hedef
      - name: Tarayıcı kur (Playwright + Chromium)
        if: ${{ (github.event.inputs.yontem || 'tarayici') == 'tarayici' }}
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Canlı yoğunluk ölçümü
        env:
          ANLIK_EKRAN: ${{ github.workspace }}/tani
        run: |
          mkdir -p tani
          LIM=""; [ -n "${{ github.event.inputs.limit }}" ] && LIM="--limit ${{ github.event.inputs.limit }}"
          if [ "${{ github.event.inputs.yontem || 'tarayici' }}" = "tarayici" ]; then
            python collector/google_anlik_yogunluk_tarayici.py --hedef "hedef/${HEDEF}" --out anlik_shard.sqlite \
              --shard ${{ matrix.shard }} --num-shards 6 --max-seconds "${{ github.event.inputs.max_saniye || '2400' }}" $LIM
          else
            python collector/google_anlik_yogunluk.py --hedef "hedef/${HEDEF}" --out anlik_shard.sqlite \
              --shard ${{ matrix.shard }} --num-shards 6 --max-seconds "${{ github.event.inputs.max_saniye || '2400' }}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anlik-tani-${{ matrix.shard }}
          path: tani/
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: anlik-shard-${{ matrix.shard }}
          path: anlik_shard.sqlite
          retention-days: 2

  birlestir:
    name: "Ölçümleri anlık yoğunluk ambarına ekle"
    needs: [olcum]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: geoprop-anlik-yogunluk-yazma
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: anlik-shard-*
          path: shards/
      - name: Birleştir ve release'e yaz
        run: |
          mkdir -p warehouse/product
          ops/ambar_indir.sh google_anlik_yogunluk.sqlite warehouse/product || echo "ilk koşu: ambar yeni oluşturulacak"
          python - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, sqlite3, sys
          sys.path.insert(0, "collector")
          from google_anlik_yogunluk_tarayici import init_db
          out = init_db("warehouse/product/google_anlik_yogunluk.sqlite")
          # eski istek yöntemi: [84] yanıtta yoksa 'populer_yok' yazılmıştı; profil yok demek değil → düzelt
          out.execute("UPDATE google_anlik_yogunluk SET durum='yanitta_yok' WHERE durum='populer_yok' AND yontem IS NULL")
          once = out.execute("SELECT COUNT(*) FROM google_anlik_yogunluk").fetchone()[0]
          for f in sorted(glob.glob("shards/*/anlik_shard.sqlite")):
              out.execute("ATTACH DATABASE ? AS s", (f,))
              kol = [r[1] for r in out.execute("PRAGMA s.table_info(google_anlik_yogunluk)")]
              kl = ",".join(kol)
              out.execute(f"INSERT OR IGNORE INTO google_anlik_yogunluk ({kl}) SELECT {kl} FROM s.google_anlik_yogunluk")
              out.execute("INSERT OR IGNORE INTO google_tipik_yogunluk_profil SELECT * FROM s.google_tipik_yogunluk_profil")
              if out.execute("SELECT 1 FROM s.sqlite_master WHERE name = 'google_place_anlik_kayit'").fetchone():
                  kk = ",".join(r[1] for r in out.execute("PRAGMA s.table_info(google_place_anlik_kayit)"))
                  out.execute(f"INSERT OR IGNORE INTO google_place_anlik_kayit ({kk}) SELECT {kk} FROM s.google_place_anlik_kayit")
              out.commit(); out.execute("DETACH DATABASE s")
          sonra = out.execute("SELECT COUNT(*) FROM google_anlik_yogunluk").fetchone()[0]
          print(f"### Anlık yoğunluk: {once:,} → {sonra:,} ölçüm (+{sonra-once:,})")
          kayit = out.execute("SELECT COUNT(*) FROM google_place_anlik_kayit WHERE kosu_id = ?", ("${{ github.run_id }}",)).fetchone()[0]
          print(f"### İşletme kaydı (zaman damgalı): bu koşuda {kayit:,}")
          for d, n in out.execute("SELECT durum, COUNT(*) FROM google_anlik_yogunluk WHERE kosu_id = ? GROUP BY 1 ORDER BY 2 DESC",
                                  ("${{ github.run_id }}",)):
              print(f"- {d}: {n:,}")
          out.close()
          EOF
          ops/ambar_yukle.sh warehouse/product/google_anlik_yogunluk.sqlite

  zincir:
    name: "Zincir: sonraki saatin koşusunu başlat"
    needs: [kapi, birlestir]
    # Ölçüm/birleştirme başarısız olsa da zincir sürer; yalnız bu saatin asıl koşusu zincirler (çift zincir olmaz).
    if: ${{ always() && needs.kapi.outputs.calis == 'true' && github.event.inputs.zincir != 'false' && github.event.inputs.limit == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Sonraki saatin :23'ünü bekle ve başlat
        run: |
          RUN_CREATED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -q .created_at)
          # hedef: bu koşunun saatinden SONRAKİ ilk saat :23 (aynı saate düşerse kapı onu atlardı)
          HEDEF=$(( $(date -u -d "${RUN_CREATED:0:13}:00:00Z" +%s) + 3600 + 23*60 ))
          SIMDI=$(date -u +%s)
          while [ $HEDEF -lt $((SIMDI + 60)) ]; do HEDEF=$((HEDEF + 3600)); done
          echo "sonraki koşu: $(date -u -d @$HEDEF '+%F %H:%M') UTC ($(( (HEDEF - SIMDI) / 60 )) dk sonra)"
          sleep $((HEDEF - SIMDI))
          gh workflow run google_anlik_yogunluk.yml --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME:-main}"
          echo "### Zincir: $(date -u '+%F %H:%M') UTC'de sonraki koşu başlatıldı" >> "$GITHUB_STEP_SUMMARY"
