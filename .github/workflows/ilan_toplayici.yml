name: "Turkiye Tum Gayrimenkul Ilanlari (40 Makine - Emlakjet & Hepsiemlak)"

on:
  workflow_dispatch:
    inputs:
      kategori:
        description: 'Çekilecek Kategoriler (arsa, konut, isyeri veya hepsi)'
        required: true
        default: 'arsa,konut,isyeri'
        type: choice
        options:
          - 'arsa,konut,isyeri'
          - 'arsa'
          - 'konut'
          - 'isyeri'
          - 'arsa,konut'
      kaynak:
        description: 'Veri Kaynağı (hepsi = Hem Hepsiemlak Hem Emlakjet)'
        required: true
        default: 'hepsi'
        type: choice
        options:
          - 'hepsi'
          - 'hepsiemlak'
          - 'emlakjet'
      max_sayfa:
        description: 'İlçe Başına Maksimum Sayfa Derinliği'
        required: false
        default: '50'
        type: string
      hiz:
        description: 'İstekler Arası Bekleme (saniye)'
        required: false
        default: '1.2'
        type: string

permissions:
  contents: write

jobs:
  tara_matrix:
    name: "Grup ${{ matrix.grup }} (İller: ${{ matrix.iller }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        include:
          - { grup: 1, iller: "1,2" }      # Adana, Adıyaman
          - { grup: 2, iller: "3,4" }      # Afyonkarahisar, Ağrı
          - { grup: 3, iller: "5,6" }      # Amasya, Ankara
          - { grup: 4, iller: "7,8" }      # Antalya, Artvin
          - { grup: 5, iller: "9,10" }     # Aydın, Balıkesir
          - { grup: 6, iller: "11,12" }    # Bilecik, Bingöl
          - { grup: 7, iller: "13,14" }    # Bitlis, Bolu
          - { grup: 8, iller: "15,16" }    # Burdur, Bursa
          - { grup: 9, iller: "17,18" }    # Çanakkale, Çankırı
          - { grup: 10, iller: "19,20" }   # Çorum, Denizli
          - { grup: 11, iller: "21,22" }   # Diyarbakır, Edirne
          - { grup: 12, iller: "23,24" }   # Elazığ, Erzincan
          - { grup: 13, iller: "25,26" }   # Erzurum, Eskişehir
          - { grup: 14, iller: "27,28" }   # Gaziantep, Giresun
          - { grup: 15, iller: "29,30" }   # Gümüşhane, Hakkari
          - { grup: 16, iller: "31,32" }   # Hatay, Isparta
          - { grup: 17, iller: "33" }      # Mersin
          - { grup: 18, iller: "34" }      # İstanbul
          - { grup: 19, iller: "35" }      # İzmir
          - { grup: 20, iller: "36,37" }   # Kars, Kastamonu
          - { grup: 21, iller: "38,39" }   # Kayseri, Kırklareli
          - { grup: 22, iller: "40,41" }   # Kırşehir, Kocaeli
          - { grup: 23, iller: "42,43" }   # Konya, Kütahya
          - { grup: 24, iller: "44,45" }   # Malatya, Manisa
          - { grup: 25, iller: "46,47" }   # Kahramanmaraş, Mardin
          - { grup: 26, iller: "48,49" }   # Muğla, Muş
          - { grup: 27, iller: "50,51" }   # Nevşehir, Niğde
          - { grup: 28, iller: "52,53" }   # Ordu, Rize
          - { grup: 29, iller: "54,55" }   # Sakarya, Samsun
          - { grup: 30, iller: "56,57" }   # Siirt, Sinop
          - { grup: 31, iller: "58,59" }   # Sivas, Tekirdağ
          - { grup: 32, iller: "60,61" }   # Tokat, Trabzon
          - { grup: 33, iller: "62,63" }   # Tunceli, Şanlıurfa
          - { grup: 34, iller: "64,65" }   # Uşak, Van
          - { grup: 35, iller: "66,67" }   # Yozgat, Zonguldak
          - { grup: 36, iller: "68,69" }   # Aksaray, Bayburt
          - { grup: 37, iller: "70,71" }   # Karaman, Kırıkkale
          - { grup: 38, iller: "72,73,74" } # Batman, Şırnak, Bartın
          - { grup: 39, iller: "75,76,77" } # Ardahan, Iğdır, Yalova
          - { grup: 40, iller: "78,79,80,81" } # Karabük, Kilis, Osmaniye, Düzce

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Node.js 22 Kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları Kur
        run: |
          npm install puppeteer-core
          pip install pandas

      - name: Xvfb Başlat (Ubuntu Sanal Ekran)
        run: |
          sudo apt-get update -y && sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "CHROME_BIN=/usr/bin/google-chrome" >> $GITHUB_ENV

      - name: "İlanları Topla (İller: ${{ matrix.iller }})"
        run: |
          node gayrimenkul_toplayici.mjs \
            --iller "${{ matrix.iller }}" \
            --kategori "${{ github.event.inputs.kategori || 'arsa,konut,isyeri' }}" \
            --kaynak "${{ github.event.inputs.kaynak || 'hepsi' }}" \
            --max-sayfa "${{ github.event.inputs.max_sayfa || '50' }}" \
            --hiz "${{ github.event.inputs.hiz || '1.2' }}" \
            --export-csv

      - name: "Sonuçları Paketle"
        run: |
          mkdir -p cikti_grup_${{ matrix.grup }}
          [ -f data/turkiye_tum_ilanlar.sqlite ] && cp data/turkiye_tum_ilanlar.sqlite cikti_grup_${{ matrix.grup }}/ilanlar_${{ matrix.grup }}.sqlite || true
          [ -d data/csv_ciktilari ] && cp -r data/csv_ciktilari cikti_grup_${{ matrix.grup }}/ || true
          tar -czf grup_${{ matrix.grup }}_verileri.tar.gz cikti_grup_${{ matrix.grup }}

      - name: "Artifaktı Yükle"
        uses: actions/upload-artifact@v4
        with:
          name: ilanlar-grup-${{ matrix.grup }}
          path: grup_${{ matrix.grup }}_verileri.tar.gz
          retention-days: 7

  birlestir:
    name: "Tüm Türkiye İlan Verilerini Birleştir"
    needs: tara_matrix
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları Kur
        run: |
          pip install pandas

      - name: "Tüm Grup Artifaktlarını İndir"
        uses: actions/download-artifact@v4
        with:
          path: tum_gruplar

      - name: "Tek Veritabanı ve Ayrıntılı CSV'leri Birleştir"
        run: |
          python export_ayrintili_csv.py --birlestir-dizin tum_gruplar

      - name: "Zip Paketi Hazırla"
        run: |
          mkdir -p tum_turkiye_nihai_paket
          [ -f data/turkiye_tum_ilanlar.sqlite ] && cp data/turkiye_tum_ilanlar.sqlite tum_turkiye_nihai_paket/ || true
          [ -d data/csv_ciktilari ] && cp -r data/csv_ciktilari tum_turkiye_nihai_paket/ || true
          zip -r turkiye_tum_ilanlar_tam_veriseti.zip tum_turkiye_nihai_paket/

      - name: "Tüm Türkiye İlan Paketini Artifakt Olarak Yükle"
        uses: actions/upload-artifact@v4
        with:
          name: TURKIYE-TUM-ILANLAR-40-MAKINE-PAKETI
          path: turkiye_tum_ilanlar_tam_veriseti.zip
          retention-days: 14
