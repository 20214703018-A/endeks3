name: TOBB PDF Archive Checks

on:
  push:
    paths:
      - 'collector/tobb_40_shard_pdf_indirici.py'
      - 'collector/tobb_pdf_archive.py'
      - 'geoprop/apply_shard_pdf_updates.py'
      - 'tests/test_tobb_pdf_archive.py'
      - '.github/workflows/tobb_pdf_archive_checks.yml'
  pull_request:
    paths:
      - 'collector/tobb_40_shard_pdf_indirici.py'
      - 'collector/tobb_pdf_archive.py'
      - 'geoprop/apply_shard_pdf_updates.py'
      - 'tests/test_tobb_pdf_archive.py'
      - '.github/workflows/tobb_pdf_archive_checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests 'pikepdf>=10,<11' pytest
      - run: python -m pytest -q tests/test_tobb_pdf_archive.py
