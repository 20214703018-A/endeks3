name: "Turkiye Ada-Parsel İmar, Plan Künyesi ve Geo Harita Toplayıcı (40 Paralel Makine)"

on:
  workflow_dispatch:
    inputs:
      limit_per_group:
        description: 'Makinelerin Grup Başına Çekeceği Parsel Limiti'
        required: false
        default: '200'
        type: string
  schedule:
    # Her gece saat 03:30'da otomatik çalışarak tüm Türkiye ada ve parsellerini tarar
    - cron: '30 3 * * *'

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. FAZ: 40 EŞZAMANLI PARALEL MAKİNE İLE TÜRKİYE GENELİ 81 İL TARAMASI
  # =========================================================================
  parsel_matrix:
    name: "Grup ${{ matrix.grup }}/40 - ${{ matrix.bolge }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        include:
          - { grup: 1, bolge: "Adana & Adıyaman", iller: "adana,adiyaman" }
          - { grup: 2, bolge: "Afyonkarahisar & Ağrı", iller: "afyonkarahisar,agri" }
          - { grup: 3, bolge: "Amasya & Ankara", iller: "amasya,ankara" }
          - { grup: 4, bolge: "Antalya & Artvin", iller: "antalya,artvin" }
          - { grup: 5, bolge: "Aydın & Balıkesir", iller: "aydin,balikesir" }
          - { grup: 6, bolge: "Bilecik & Bingöl", iller: "bilecik,bingol" }
          - { grup: 7, bolge: "Bitlis & Bolu", iller: "bitlis,bolu" }
          - { grup: 8, bolge: "Burdur & Bursa", iller: "burdur,bursa" }
          - { grup: 9, bolge: "Çanakkale & Çankırı", iller: "canakkale,cankiri" }
          - { grup: 10, bolge: "Çorum & Denizli", iller: "corum,denizli" }
          - { grup: 11, bolge: "Diyarbakır & Edirne", iller: "diyarbakir,edirne" }
          - { grup: 12, bolge: "Elazığ & Erzincan", iller: "elazig,erzincan" }
          - { grup: 13, bolge: "Erzurum & Eskişehir", iller: "erzurum,eskisehir" }
          - { grup: 14, bolge: "Gaziantep & Giresun", iller: "gaziantep,giresun" }
          - { grup: 15, bolge: "Gümüşhane & Hakkari", iller: "gumushane,hakkari" }
          - { grup: 16, bolge: "Hatay & Isparta", iller: "hatay,isparta" }
          - { grup: 17, bolge: "Mersin", iller: "mersin" }
          - { grup: 18, bolge: "İstanbul Megakent", iller: "istanbul" }
          - { grup: 19, bolge: "İzmir Megakent", iller: "izmir" }
          - { grup: 20, bolge: "Kars & Kastamonu", iller: "kars,kastamonu" }
          - { grup: 21, bolge: "Kayseri & Kırklareli", iller: "kayseri,kirklareli" }
          - { grup: 22, bolge: "Kırşehir & Kocaeli", iller: "kirsehir,kocaeli" }
          - { grup: 23, bolge: "Konya & Kütahya", iller: "konya,kutahya" }
          - { grup: 24, bolge: "Malatya & Manisa", iller: "malatya,manisa" }
          - { grup: 25, bolge: "Kahramanmaraş & Mardin", iller: "kahramanmaras,mardin" }
          - { grup: 26, bolge: "Muğla & Muş", iller: "mugla,mus" }
          - { grup: 27, bolge: "Nevşehir & Niğde", iller: "nevsehir,nigde" }
          - { grup: 28, bolge: "Ordu & Rize", iller: "ordu,rize" }
          - { grup: 29, bolge: "Sakarya & Samsun", iller: "sakarya,samsun" }
          - { grup: 30, bolge: "Siirt & Sinop", iller: "siirt,sinop" }
          - { grup: 31, bolge: "Sivas & Tekirdağ", iller: "sivas,tekirdag" }
          - { grup: 32, bolge: "Tokat & Trabzon", iller: "tokat,trabzon" }
          - { grup: 33, bolge: "Tunceli & Şanlıurfa", iller: "tunceli,sanliurfa" }
          - { grup: 34, bolge: "Uşak & Van", iller: "usak,van" }
          - { grup: 35, bolge: "Yozgat & Zonguldak", iller: "yozgat,zonguldak" }
          - { grup: 36, bolge: "Aksaray & Bayburt", iller: "aksaray,bayburt" }
          - { grup: 37, bolge: "Karaman & Kırıkkale", iller: "karaman,kirikkale" }
          - { grup: 38, bolge: "Batman, Şırnak & Bartın", iller: "batman,sirnak,bartin" }
          - { grup: 39, bolge: "Ardahan, Iğdır & Yalova", iller: "ardahan,igdir,yalova" }
          - { grup: 40, bolge: "Karabük, Kilis, Osmaniye & Düzce", iller: "karabuk,kilis,osmaniye,duzce" }

    steps:
      - name: Kodu Checkout Et
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 3.12 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Bölgesel Ada & Parsel Taraması (Grup ${{ matrix.grup }}/40 - ${{ matrix.bolge }})"
        run: |
          echo "========================================================"
          echo "MAKİNE NO: ${{ matrix.grup }}/40"
          echo "BÖLGE: ${{ matrix.bolge }}"
          echo "İLLER: ${{ matrix.iller }}"
          echo "LİMİT: ${{ github.event.inputs.limit_per_group || '200' }}"
          echo "========================================================"
          python collector/parsel_imar_ve_degisiklik_toplayici.py \
            --otomatik-kesif \
            --cikis-ek "grup_${{ matrix.grup }}" \
            --iller "${{ matrix.iller }}" \
            --limit "${{ github.event.inputs.limit_per_group || '200' }}"

      - name: "Grup Çıktılarını Artifakt Olarak Kaydet"
        uses: actions/upload-artifact@v4
        with:
          name: parsel-grup-${{ matrix.grup }}
          path: |
            collector/data/imar_ve_parseller/*grup_${{ matrix.grup }}*
          retention-days: 1
          if-no-files-found: ignore

  # =========================================================================
  # 2. FAZ: 40 BÖLGE SONUCUNU BİRLEŞTİRME VE ATOMİK GİT COMMIT & PUSH
  # =========================================================================
  birlestir_ve_yayinla:
    name: "40 Bölge Sonuçlarını Birleştir ve Yayınla"
    needs: [parsel_matrix]
    runs-on: ubuntu-latest
    
    steps:
      - name: Kodu Checkout Et
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 3.12 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "Tüm Grup Artifaktlarını İndir"
        uses: actions/download-artifact@v4
        with:
          pattern: parsel-grup-*
          path: indirilmis_artifaktlar/
          merge-multiple: true

      - name: "Artifaktları Veri Dizinine Taşı"
        run: |
          mkdir -p collector/data/imar_ve_parseller/
          find indirilmis_artifaktlar/ -type f -exec mv -f {} collector/data/imar_ve_parseller/ \;
          ls -la collector/data/imar_ve_parseller/

      - name: "Bütün Bölgesel Sonuçları Tek Bir Veritabanı ve GeoJSON'da Birleştir"
        run: |
          python collector/parsel_imar_ve_degisiklik_toplayici.py --birlestir
          # Geçici grup dosyalarını temizle, sadece ana nihai dosyalar kalsın
          rm -f collector/data/imar_ve_parseller/*_grup_* || true

      - name: "Nihai Çıktıları Kontrol Et"
        run: |
          ls -lh collector/data/imar_ve_parseller/

      - name: "Nihai Verileri Git Depoya Atomik Kaydet ve Push Et"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f collector/data/imar_ve_parseller/
          
          if git diff --staged --quiet; then
            echo "Yeni parsel veya imar verisi değişikliği yok, push atlanıyor."
          else
            git commit -m "feat(parsel): 40 bölgeden toplanan ada/parsel, imar ve GeoJSON harita katmanı birleştirildi [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
