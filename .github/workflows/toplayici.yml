name: Tüm Türkiye 40 Sanal Makine Veri Toplayıcı (Student Pack)

on:
  workflow_dispatch:
    inputs:
      hiz:
        description: 'İstekler arası bekleme (saniye) - Varsayılan: 0.5'
        required: true
        default: '0.5'
        type: string

jobs:
  # =========================================================================
  # GÖREV 1: EKSİK KALAN İLLER (Makineler 01-06) - ~10-15 dk
  # =========================================================================
  eksik_iller_toplayici:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "m01_van"
            name: "01 - Van (Kalan Mahalleler)"
            iller: "65"
          - id: "m02_batman"
            name: "02 - Batman"
            iller: "72"
          - id: "m03_sirnak"
            name: "03 - Şırnak"
            iller: "73"
          - id: "m04_ardahan"
            name: "04 - Ardahan"
            iller: "75"
          - id: "m05_igdir"
            name: "05 - Iğdır"
            iller: "76"
          - id: "m06_kilis"
            name: "06 - Kilis"
            iller: "79"

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Paketler
        run: sudo apt-get update && sudo apt-get install -y zip sqlite3

      - name: Mahalle ve Piyasa Verilerini Topla
        run: |
          COLLECTOR_DIR=$(dirname $(find . -name "collector.py" | head -n 1))
          cd "$COLLECTOR_DIR"
          echo "Tarama başlıyor: ${{ matrix.name }}, İller=${{ matrix.iller }}"
          python3 collector.py --iller "${{ matrix.iller }}" --hiz ${{ inputs.hiz }}

      - name: Tüm CSV Dosyalarını Üret (E-Ticaret Dahil 17 Tablo)
        if: always()
        run: |
          COLLECTOR_DIR=$(dirname $(find . -name "export_csv.py" | head -n 1))
          cd "$COLLECTOR_DIR"
          python3 export_csv.py || true

      - name: Verileri Paketle
        if: always()
        run: |
          COLLECTOR_DIR=$(dirname $(find . -name "collector.py" | head -n 1))
          cd "$COLLECTOR_DIR"
          if [ -d "data" ]; then
            zip -r "paket_${{ matrix.id }}.zip" data/csv_ciktilari data/piyasa_verileri.db || true
          fi

      - name: Paketi Yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: |
            **/paket_${{ matrix.id }}.zip
            **/data/csv_ciktilari/*.csv
          retention-days: 14

  # =========================================================================
  # GÖREV 2: TÜM TÜRKİYE POI 2000 PERAKENDE & DONATI (Makineler 07-20) - ~1-2 dk
  # =========================================================================
  poi_perakende_toplayici:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "m07_poi_1_6"
            name: "07 - POI (01-06 Adana..Ankara)"
            iller: "1,2,3,4,5,6"
          - id: "m08_poi_7_12"
            name: "08 - POI (07-12 Antalya..Bingöl)"
            iller: "7,8,9,10,11,12"
          - id: "m09_poi_13_18"
            name: "09 - POI (13-18 Bitlis..Çankırı)"
            iller: "13,14,15,16,17,18"
          - id: "m10_poi_19_24"
            name: "10 - POI (19-24 Çorum..Erzincan)"
            iller: "19,20,21,22,23,24"
          - id: "m11_poi_25_30"
            name: "11 - POI (25-30 Erzurum..Hakkari)"
            iller: "25,26,27,28,29,30"
          - id: "m12_poi_31_34"
            name: "12 - POI (31-34 Hatay..İstanbul)"
            iller: "31,32,33,34"
          - id: "m13_poi_35_40"
            name: "13 - POI (35-40 İzmir..Kırşehir)"
            iller: "35,36,37,38,39,40"
          - id: "m14_poi_41_46"
            name: "14 - POI (41-46 Kocaeli..K.Maraş)"
            iller: "41,42,43,44,45,46"
          - id: "m15_poi_47_52"
            name: "15 - POI (47-52 Mardin..Ordu)"
            iller: "47,48,49,50,51,52"
          - id: "m16_poi_53_58"
            name: "16 - POI (53-58 Rize..Sivas)"
            iller: "53,54,55,56,57,58"
          - id: "m17_poi_59_64"
            name: "17 - POI (59-64 Tekirdağ..Uşak)"
            iller: "59,60,61,62,63,64"
          - id: "m18_poi_65_70"
            name: "18 - POI (65-70 Van..Karaman)"
            iller: "65,66,67,68,69,70"
          - id: "m19_poi_71_76"
            name: "19 - POI (71-76 Kırıkkale..Iğdır)"
            iller: "71,72,73,74,75,76"
          - id: "m20_poi_77_81"
            name: "20 - POI (77-81 Yalova..Düzce)"
            iller: "77,78,79,80,81"

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: POI Perakende Verilerini Topla (size=2000)
        run: |
          SCRIPT=$(find . -name "ofis_ve_poi_toplayici.py" | head -n 1)
          python3 "$SCRIPT" --mod poi --iller "${{ matrix.iller }}" --hiz 0.2

      - name: POI Paketini Yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: |
            **/data/csv_ciktilari/08_ilce_onemli_noktalar_poi.csv
            **/data/piyasa_verileri.db
          retention-days: 14

  # =========================================================================
  # GÖREV 3: SAYFALAMALI EMLAK OFİSİ VE DANIŞMAN REHBERİ (Makineler 21-40) - ~2-3 dk
  # =========================================================================
  ofis_ve_danisman_toplayici:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "m21_ofis_1_4"
            name: "21 - Ofis & Danışman (01-04)"
            iller: "1,2,3,4"
          - id: "m22_ofis_5_8"
            name: "22 - Ofis & Danışman (05-08)"
            iller: "5,6,7,8"
          - id: "m23_ofis_9_12"
            name: "23 - Ofis & Danışman (09-12)"
            iller: "9,10,11,12"
          - id: "m24_ofis_13_16"
            name: "24 - Ofis & Danışman (13-16)"
            iller: "13,14,15,16"
          - id: "m25_ofis_17_20"
            name: "25 - Ofis & Danışman (17-20)"
            iller: "17,18,19,20"
          - id: "m26_ofis_21_24"
            name: "26 - Ofis & Danışman (21-24)"
            iller: "21,22,23,24"
          - id: "m27_ofis_25_28"
            name: "27 - Ofis & Danışman (25-28)"
            iller: "25,26,27,28"
          - id: "m28_ofis_29_32"
            name: "28 - Ofis & Danışman (29-32)"
            iller: "29,30,31,32"
          - id: "m29_ofis_33_34"
            name: "29 - Ofis & Danışman (33-34 Mersin, İstanbul)"
            iller: "33,34"
          - id: "m30_ofis_35_38"
            name: "30 - Ofis & Danışman (35-38 İzmir..Kayseri)"
            iller: "35,36,37,38"
          - id: "m31_ofis_39_42"
            name: "31 - Ofis & Danışman (39-42 Kırklareli..Konya)"
            iller: "39,40,41,42"
          - id: "m32_ofis_43_46"
            name: "32 - Ofis & Danışman (43-46 Kütahya..K.Maraş)"
            iller: "43,44,45,46"
          - id: "m33_ofis_47_50"
            name: "33 - Ofis & Danışman (47-50 Mardin..Nevşehir)"
            iller: "47,48,49,50"
          - id: "m34_ofis_51_54"
            name: "34 - Ofis & Danışman (51-54 Niğde..Sakarya)"
            iller: "51,52,53,54"
          - id: "m35_ofis_55_58"
            name: "35 - Ofis & Danışman (55-58 Samsun..Sivas)"
            iller: "55,56,57,58"
          - id: "m36_ofis_59_62"
            name: "36 - Ofis & Danışman (59-62 Tekirdağ..Tunceli)"
            iller: "59,60,61,62"
          - id: "m37_ofis_63_66"
            name: "37 - Ofis & Danışman (63-66 Şanlıurfa..Yozgat)"
            iller: "63,64,65,66"
          - id: "m38_ofis_67_70"
            name: "38 - Ofis & Danışman (67-70 Zonguldak..Karaman)"
            iller: "67,68,69,70"
          - id: "m39_ofis_71_75"
            name: "39 - Ofis & Danışman (71-75 Kırıkkale..Ardahan)"
            iller: "71,72,73,74,75"
          - id: "m40_ofis_76_81"
            name: "40 - Ofis & Danışman (76-81 Iğdır..Düzce)"
            iller: "76,77,78,79,80,81"

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Emlak Ofisi ve Danışman Verilerini Topla (Sayfalamalı)
        run: |
          SCRIPT=$(find . -name "ofis_ve_poi_toplayici.py" | head -n 1)
          python3 "$SCRIPT" --mod ofis --iller "${{ matrix.iller }}" --hiz 0.2

      - name: Ofis ve Danışman Paketini Yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: |
            **/data/csv_ciktilari/09_emlak_ofisleri_rehberi.csv
            **/data/csv_ciktilari/10_gayrimenkul_danismanlari.csv
            **/data/piyasa_verileri.db
          retention-days: 14
