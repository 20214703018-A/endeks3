name: Market Fiyatı ürün fiyat geçmişi (40 makine)

# 81 ilde, ürün×il çifti başına son 90 günün günlük fiyat serisi (api.marketfiyati.org.tr /v3/price-history).
# Girdi: consolidation/girdi/marketfiyati_history_girdi.parquet (il_geo_id, id, depotId — 634.913 çift).
# Her makine çiftlerin i/N payını çeker; sunucu art arda 25 isteği reddederse o makine DURUR (kimlik değiştirilmez).
# Çıktı: makine başına artifact → yerelde gh run download → GEOPROP_RAW_INTAKE/marketfiyati/<RUN_DATE>/history/

on:
  schedule:
    - cron: '0 21 2 * *'   # ayda bir: API son 90 günü veriyor, aylık çekimle pencereler üst üste biner
  workflow_dispatch:

jobs:
  ayar:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          set -a; . .github/marketfiyati_gecmis_run.env; set +a
          echo "matrix=$(python3 -c "import json; print(json.dumps(list(range(1, $SHARDS + 1))))")" >> "$GITHUB_OUTPUT"

  gecmis:
    needs: ayar
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 34  # 6 makine anlık yoğunluk ölçümüne ayrılı
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.ayar.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -q pandas pyarrow requests
      - name: topla
        run: |
          set -a; . .github/marketfiyati_gecmis_run.env; set +a
          RUN_DATE=$(date -u +%Y-%m-%d)   # sabit tarih yerine koşu günü (env'deki RUN_DATE yalnız ilk elle koşu içindi)
          echo "RUN_DATE=$RUN_DATE" >> "$GITHUB_ENV"
          INTAKE_RUN_DATE="$RUN_DATE" python -u consolidation/tools/intake_marketfiyati.py history \
            --prices-file consolidation/girdi/marketfiyati_history_girdi.parquet \
            --history-ils all --il-shard "${{ matrix.shard }}/$SHARDS" \
            --rps "$RPS" --threads "$THREADS" --max-minutes "$MAX_MINUTES"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mf_gecmis_${{ github.run_id }}_${{ matrix.shard }}
          path: |
            ~/Desktop/GEOPROP_RAW_INTAKE/marketfiyati/${{ env.RUN_DATE }}/history/
            ~/Desktop/GEOPROP_RAW_INTAKE/marketfiyati/${{ env.RUN_DATE }}/run.log
          retention-days: 30
          if-no-files-found: warn

  kalici_kayit:
    name: "Kalıcı kayıt: fiyat geçmişini release'e yaz (artifact 30 günde silinir)"
    needs: gecmis
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mf_gecmis_${{ github.run_id }}_*
          path: mf/
      - run: |
          GUN=$(date -u +%Y-%m-%d)
          gh release view marketfiyati-gecmis --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create marketfiyati-gecmis --repo "$GITHUB_REPOSITORY" --latest=false -t "Market Fiyatı ürün fiyat geçmişi (aylık çekimler)" \
              -n "Her çekim o günden geriye 90 günü kapsar; çekimler üst üste binerek kesintisiz seri oluşturur."
          tar -czf "marketfiyati_gecmis_${GUN}.tgz" -C mf .
          ls -la "marketfiyati_gecmis_${GUN}.tgz"
          gh release upload marketfiyati-gecmis "marketfiyati_gecmis_${GUN}.tgz" --clobber --repo "$GITHUB_REPOSITORY"
