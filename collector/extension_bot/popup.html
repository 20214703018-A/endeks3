<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>GEOPROP Bot</title>
    <style>
        body { width: 250px; font-family: Arial, sans-serif; padding: 15px; text-align: center; }
        button { background-color: #4CAF50; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; width: 100%; margin-bottom: 10px; }
        button.stop { background-color: #f44336; }
        #status, #progress, #cities { font-size: 12px; color: #555; word-wrap: break-word; }
        #progress { font-weight: 700; color: #222; }
        #cities { text-align: left; line-height: 1.45; }
    </style>
</head>
<body>
    <h3>GEOPROP Menü</h3>
    <label for="workers" style="font-size:12px;display:block;margin-bottom:8px;">Paralel pencere:
        <select id="workers">
            <option value="1">1 (en güvenli)</option>
            <option value="2" selected>2 (önerilen)</option>
            <option value="3">3</option>
            <option value="4">4 (en hızlı, CAPTCHA riski yüksek)</option>
        </select>
    </label>
    <button id="startBtn">Taramayı Başlat</button>
    <button id="stopBtn" class="stop">Durdur</button>
    <p id="status">Bekliyor...</p>
    <p id="progress">Kuyruk durumu yükleniyor...</p>
    <p id="cities"></p>
    <script src="popup.js"></script>
</body>
</html>
