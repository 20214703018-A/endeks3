# ---------------------------------------------------------------------------------------------
kurallar:
  - id: projeksiyon_haric
    tanim: "2026-08 sonrası fiyat ayları kaynağın kendi tahminidir (projeksiyon). Varsayılan olarak dışlanır; yalnız açıkça istenirse 'TAHMİN' etiketiyle gösterilir."
  - id: osm_semantigi
    tanim: "OSM hareketliliği 'haritaya ekleme/çıkarma'dır; işletme açılışı/kapanışı DEĞİLDİR. 2021-01 ilk kesit sol-sansürlüdür. Farklı kaynaklar arası fark hareketlilik sayılmaz."
    yasak_ifadeler: ["açıldı", "kapandı", "açılış", "kapanış", "iflas"]
  - id: gecerli_koordinat
    tanim: "Mekânsal analizlerde yalnız koordinatı geçerli işletmeler kullanılır (7.847 bozuk koordinat dışlanır)."
  - id: kategori_belirsiz
    tanim: "Türü belirlenemeyen işletmeler kategori sayımlarına eklenmez; alan başına 'türü belirsiz' sayısı ayrıca bildirilir. Sektör ipucu (sector_hint) kesin kategori sayılmaz."
  - id: eslesme_oneri
    tanim: "Mahalle eşleşmeleri PROPOSED (insan onayı bekliyor). Bağ bandı 'review_recommended'/'no_auto_merge' olan yerler uyarıyla gösterilir."
  - id: kisisel_veri
    tanim: "Telefon, kişi adı, e-posta hiçbir çıktıda verilmez (column_sensitivity_v1)."
  - id: karantina
    tanim: "Karantinadaki (qstg) ve sahte olduğu kanıtlı tablolar agent tarafından hiç okunmaz."
  - id: seri_karistirma
    tanim: "Revizyon öncesi ve sonrası TÜİK serileri aynı tabloda toplanmaz/karşılaştırılmaz."
  - id: toplanamaz
    tanim: "Fiyat, oran, endeks gibi 'toplanabilir: false' ölçüler alt seviyelerden toplanarak/ortalanarak üst seviyeye çıkarılmaz; üst seviye değeri kaynağın kendi üst seviye serisidir. Alt seviyelerin dağılımı (medyan, yüzdelikler) ayrıca istenebilir."
  - id: yorum_yok
    tanim: "Çıktı sayı, tablo ve künyedir. 'İyi/kötü/yatırıma uygun' gibi değerlendirme yapılmaz (proje kuralı 1)."
  - id: uygunluk_skoru
    tanim: "Uygunluk skoru bir MODEL çıktısıdır: profildeki varsayımsal kriter ve ağırlıklara göre göreli sıralama (0–100). Talep/ciro/kâr ölçümü ya da yatırım tavsiyesi değildir; varsayımlar tabloda açıkça yazılır ve değiştirilebilir."
  - id: projeksiyon_model
    tanim: "Projeksiyon bir MODEL çıktısıdır (ölçüm değil): geçmiş eğilimin geriye dönük sınanmış istatistiksel uzantısı; %80 aralık geçmiş gerçek hatalardan. Kırılmaları (faiz, politika, afet) içermez; kaynağın kendi projeksiyonundan ayrı gösterilir."
  - id: dis_varsayim
    tanim: "Web/kullanıcı kaynaklı bilgi yalnız kaynak adı, adresi ve erişim tarihiyle girer; hesaba yalnız tanımlı anahtarlar (yıllık enflasyon, nüfus büyüme senaryosu) katılır; plan parmak izine dahildir."
  - id: tekillestirme
    tanim: "Aynı yer-ölçü-dönem için birden çok kaynak satırı varsa: değerler eşitse tek değer; farklıysa en güncel kaynak güncelleme zamanı, eşitlikte kaynak tablo adı ve satır parmak izi sırası seçilir; 'çelişki' bayrağı ve min–max aralığı saklanır."

# ---------------------------------------------------------------------------------------------
# ANALİZ KATALOĞU — agent yalnız bunları çalıştırabilir. Parametre şemaları plan.py'de (pydantic).
analizler:
  yer_profili:        "Bir yerin tüm güncel ölçüleri, işletme dağılımı ve üst birim (ilçe/il) değerleriyle yan yana."
  karsilastir:        "Birden çok yeri seçilen ölçülerde yan yana koyar (güncel değer)."
  sirala:             "Bir kapsam içinde (ör. İzmir'in mahalleleri) bir ölçüye göre sıralama; en yüksek/en düşük N."
  zaman_serisi:       "Bir veya birkaç yerin bir ölçüdeki dönemsel seyri + dönem değişimleri (aylık, yıllık, dönem başı–sonu, yıllık bileşik)."
  dagilim:            "Bir kapsam içindeki alt birimlerin bir ölçüdeki dağılımı: n, min, p10, p25, medyan, p75, p90, max, ortalama."
  yakin_cevre:        "Bir nokta/yer çevresinde (yarıçap m) işletmeler (sektör/kategori sayıları), harita nesneleri (okul, durak...), alan-ağırlıklı yaklaşık nüfus."
  yogunluk:           "Bir kapsam içinde alt birimlerin kategori/sektör işletme sayısı, 1.000 kişi ve km² başına."
  kategori_dagilimi:  "Bir yerin işletmelerinin sektör/kategori kırılımı ve payları."
  benzer_yerler:      "Seçilen ölçülerde standartlaştırılmış (z-skor) Öklid uzaklığına göre en benzer N yer."
  harita_hareketliligi: "OSM kesitleri arasında haritaya eklenen/çıkan nesneler (açılış/kapanış değildir)."
  isletme_listesi:    "Kapsam/nokta çevresindeki işletmelerin koordinatlı listesi (filtre: kategori, sektör, puan)."
  iliski:             "İki ölçü arasında alt birimler üzerinden Pearson ve Spearman korelasyonu (n ile)."
  veri_kapsami:       "Bir ölçünün hangi seviyelerde, hangi dönemlerde, kaç yerde bulunduğu."
  uygun_bolge:        "İşletme/yazılım/ürün için uygun bölgeleri açık ağırlıklı çok kriterli skorla sıralar (profiller.yaml); sağlamlık testi dahil."
  gelecek_projeksiyonu: "Bir ölçünün geleceğe dönük istatistiksel projeksiyonu (geçmişte sınanmış model topluluğu + ölçülmüş %80 aralık + kaynağın tahmini + dış varsayımlar)."
  bolge_gelecek_raporu: "Bir bölge için nüfus, fiyat, kira, satış projeksiyonları + öncü göstergeler + dış kaynak bağlamı."
