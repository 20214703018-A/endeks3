# Sunum katmanında hesaplanan (türetilmiş) ölçüler — formül açıkça yazılır, gizli hesap yoktur.
turetilmis_olculer:
  isletme_sayisi:          {ad: "İşletme sayısı (geçerli koordinatlı)", esanlam: [işletme sayısı, dükkan sayısı, iş yeri sayısı, poi sayısı], birim: adet, seviyeler: [mahalle, ilce, il], formul: "count(isletme) where gecerli_koordinat", toplanabilir: true, tema: ticaret, donem: "2026-09 (tek kesit)"}
  nufus_yogunlugu:         {ad: "Nüfus yoğunluğu", esanlam: [nüfus yoğunluğu, yoğunluk kişi km2], birim: "kişi/km²", seviyeler: [mahalle, ilce, il], formul: "nufus / alan_km2", tema: demografi}
  alan_km2:                {ad: "Yüzölçümü (poligondan)", esanlam: [alan, yüzölçümü, büyüklük km2], birim: km², seviyeler: [mahalle, ilce, il], formul: "ST_Area_Spheroid(poligon)/1e6", toplanabilir: true, tema: cografya}
  bin_kisi_basina_isletme: {ad: "1.000 kişiye düşen işletme", esanlam: [kişi başına işletme, işletme yoğunluğu], birim: "adet/1.000 kişi", seviyeler: [mahalle, ilce, il], formul: "isletme_sayisi / nufus * 1000", tema: ticaret}
  km2_basina_isletme:      {ad: "km² başına işletme", esanlam: [alan başına işletme], birim: "adet/km²", seviyeler: [mahalle, ilce, il], formul: "isletme_sayisi / alan_km2", tema: ticaret}
  nufus_degisim_5y:        {ad: "Nüfus değişimi, son 5 yıl (TÜİK)", esanlam: [nüfus artışı, nüfus büyümesi, nüfus değişimi], birim: "%", seviyeler: [ilce, il], formul: "(nüfus[son yıl] / nüfus[son yıl − 5] − 1) × 100; TÜİK ADNKS ilçe (il = ilçe toplamı)", tema: demografi, donem: "2020→2025"}
  konut_satis_12ay:        {ad: "Konut satış sayısı, son 12 ay toplamı (TÜİK 2025 revizyonlu seri)", esanlam: [yıllık konut satışı, son 12 ay satış], birim: adet, seviyeler: [ilce, il, ulke], formul: "son 12 ayın konut_satis_adedi toplamı (12 ayın tamamı varsa)", toplanabilir: true, tema: konut_piyasasi}
  turu_belirsiz_isletme:   {ad: "Türü belirsiz işletme sayısı", esanlam: [türü belirsiz işletme, kategorisiz işletme], birim: adet, seviyeler: [mahalle, ilce, il], formul: "count(isletme) where gecerli_koordinat and kategori is null", toplanabilir: true, tema: ticaret, donem: "2026-09 (tek kesit)"}
  harita_nesnesi_sayisi:   {ad: "OSM harita nesnesi sayısı (türüne göre: okul, durak, eczane...)", esanlam: [okul sayısı, durak sayısı, eczane sayısı, otopark sayısı, cami sayısı, hastane sayısı], birim: adet, seviyeler: [mahalle, ilce, il], formul: "count(harita_nesnesi) where aktif, boyut=osm_kategori", toplanabilir: true, tema: altyapi, donem: "2026-09-13 OSM kesiti"}
  ortalama_puan:           {ad: "İşletmelerin ortalama Google puanı", esanlam: [ortalama puan, ortalama rating], birim: "puan (1–5)", seviyeler: [mahalle, ilce, il], formul: "avg(puan) where puan is not null", tema: ticaret}
  harita_eklenen:          {ad: "OSM haritasına eklenen nesne (dönem içinde)", esanlam: [haritaya eklenen, yeni eklenen işletme], birim: adet, seviyeler: [mahalle, ilce, il], tema: hareketlilik, formul: "analytics.mahalle_turnover_osm.added_to_map"}
  harita_cikan:            {ad: "OSM haritasından çıkan nesne (dönem içinde)", esanlam: [haritadan çıkan], birim: adet, seviyeler: [mahalle, ilce, il], tema: hareketlilik, formul: "removed_from_map"}
  harita_mevcut:           {ad: "OSM haritasında mevcut nesne", esanlam: [haritadaki işletme], birim: adet, seviyeler: [mahalle, ilce, il], tema: hareketlilik, formul: "present_on_map"}
  harita_devir_hizi:       {ad: "OSM harita devir hızı", esanlam: [devir hızı, churn], birim: "%", seviyeler: [mahalle, ilce, il], tema: hareketlilik, formul: "(eklenen+çıkan)/önceki mevcut × 100"}

