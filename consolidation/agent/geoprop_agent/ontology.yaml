# GEOPROP ONTOLOJİSİ (kavram haritası) — agent'ın bildiği her şeyin tek kaynağı.
# Kural: agent bu dosyada tanımlı olmayan bir ölçü/kavram/analiz isteyemez; istenirse "veri yok" döner.
# Sade okuma: "kavramlar" = neler var; "iliskiler" = neyin neye bağlı olduğu; "olculer" = hesaplanabilen sayılar;
# "kurallar" = yanlış kullanımı engelleyen tuzak kuralları; "analizler" = agent'ın yapabildiği hesap türleri.
surum: 0.1.0
kaynak_veritabani: canonical_v1.5   # serving katmanı bu sürümden kurulur

# ---------------------------------------------------------------------------------------------
kavramlar:
  Yer:
    tanim: "İdari birim (ülke, il, ilçe, mahalle/köy). Her yerin tek kimliği (geo_id) vardır."
    alt_turler: [Ulke, Il, Ilce, Mahalle]
    tablo: yer
  Ulke:    {ust: null, seviye: ulke, tanim: "Türkiye"}
  Il:      {ust: Ulke, seviye: il, tanim: "81 il"}
  Ilce:    {ust: Il, seviye: ilce, tanim: "973 ilçe"}
  Mahalle: {ust: Ilce, seviye: mahalle, tanim: "50.638 mahalle/köy (poligonlu)"}
  Isletme:
    tanim: "Koordinatlı ticari nokta (Google gözlemi, OSM, Yemeksepeti). Kimlik poi_id bizimdir."
    tablo: isletme
    ozellikler: [ad, kategori, sektor, puan, yorum_sayisi, lat, lon, kaynak_kapsami]
  HaritaNesnesi:
    tanim: "OSM haritasındaki kamu/altyapı/ticari nesne (okul, durak, eczane, otopark, cami...). Şu an haritada olanlar."
    tablo: harita_nesnesi
  Gozlem:
    tanim: "Bir yere, bir döneme ve bir kaynağa bağlı sayı (fiyat, nüfus, gösterge)."
    tablo: olcum
  Donem:
    tanim: "Ay (YYYY-MM), çeyrek (YYYY-Qn) veya yıl (YYYY)."
  Kaynak:
    tanim: "Verinin geldiği yer ve edinim sınıfı: official_public (resmî), web_research (web araştırması)."

iliskiler:
  - {ad: icinde, kaynak: Mahalle, hedef: Ilce, tur: "N-1", aciklama: "Mahalle bir ilçenin içindedir"}
  - {ad: icinde, kaynak: Ilce, hedef: Il, tur: "N-1"}
  - {ad: icinde, kaynak: Il, hedef: Ulke, tur: "N-1"}
  - {ad: bulunur, kaynak: Isletme, hedef: Mahalle, tur: "N-1", aciklama: "Koordinat mahalle poligonunun içinde (atama güveni ile)"}
  - {ad: bulunur, kaynak: HaritaNesnesi, hedef: Mahalle, tur: "N-1"}
  - {ad: olculur, kaynak: Gozlem, hedef: Yer, tur: "N-1"}
  - {ad: donemine_ait, kaynak: Gozlem, hedef: Donem, tur: "N-1"}
  - {ad: kaynagi, kaynak: Gozlem, hedef: Kaynak, tur: "N-1"}

# ---------------------------------------------------------------------------------------------
# ÖLÇÜLER. Alanlar:
#   ad, esanlam (doğal dil karşılıkları), birim, seviyeler, donem_turu, tema,
#   toplanabilir: alt seviyelerden toplanarak üst seviye elde edilebilir mi (sayılar evet; fiyat/oran hayır)
#   yon: 'yuksek_iyi'/'dusuk_iyi' YAZILMAZ — değerlendirme yapmayız (kural 1). Yalnız sıralama yönü kullanıcıdan gelir.
#   kaynak: serving 'olcum' tablosunu dolduran eşleme (build_serving okur).
fiyat_sablonlari:
  # price_observation (category × metric) → olcu. {k} = konut/arsa/tarla
  kategoriler:
    konut: {ad: "Konut", esanlam: [konut, ev, daire, konut piyasası]}
    arsa:  {ad: "Arsa",  esanlam: [arsa, imarlı arsa]}
    tarla: {ad: "Tarla", esanlam: [tarla, tarım arazisi, arazi]}
  metrikler:
    sale_price_m2:      {id: "{k}_satis_m2",        ad: "{K} satılık m² fiyatı (ilan)", birim: "TL/m²", esanlam: ["{k} m2 fiyatı", "{k} metrekare fiyatı", "{k} satılık m2", "{k} fiyatı"], kategoriler: [konut, arsa, tarla]}
    avg_price:          {id: "{k}_ort_ilan_fiyati",  ad: "{K} ortalama ilan fiyatı",    birim: "TL",    esanlam: ["{k} ortalama fiyat", "ortalama {k} fiyatı"], kategoriler: [konut, arsa, tarla]}
    listing_count:      {id: "{k}_ilan_sayisi",      ad: "{K} satılık ilan sayısı",     birim: "adet",  esanlam: ["{k} ilan sayısı", "{k} ilan adedi", "satılık {k} ilanı"], kategoriler: [konut, arsa, tarla], toplanabilir: true}
    avg_area_m2:        {id: "{k}_ort_alan_m2",      ad: "{K} ortalama ilan alanı",     birim: "m²",    esanlam: ["{k} ortalama metrekare", "{k} ortalama büyüklük"], kategoriler: [konut, arsa, tarla]}
    min_price_m2:       {id: "{k}_min_m2",           ad: "{K} en düşük m² fiyatı",      birim: "TL/m²", esanlam: ["{k} minimum m2"], kategoriler: [konut, arsa, tarla]}
    max_price_m2:       {id: "{k}_max_m2",           ad: "{K} en yüksek m² fiyatı",     birim: "TL/m²", esanlam: ["{k} maksimum m2"], kategoriler: [konut, arsa, tarla]}
    monthly_change:     {id: "{k}_aylik_degisim",    ad: "{K} m² fiyatı aylık değişim", birim: "%",     esanlam: ["{k} aylık artış", "{k} aylık değişim"], kategoriler: [konut, arsa, tarla], olcek: degisim}
    yearly_change:      {id: "{k}_yillik_degisim",   ad: "{K} m² fiyatı yıllık değişim",birim: "%",     esanlam: ["{k} yıllık artış", "{k} yıllık değişim", "{k} fiyat artışı"], kategoriler: [konut, arsa, tarla], olcek: degisim}
    price_index:        {id: "{k}_fiyat_endeksi",    ad: "{K} fiyat endeksi (kaynak endeksi)", birim: "endeks", esanlam: ["{k} endeksi"], kategoriler: [konut, arsa, tarla]}
    days_on_market:     {id: "{k}_ilanda_kalma_gun", ad: "{K} ilanda kalma süresi",     birim: "gün",   esanlam: ["{k} satış süresi", "{k} ilan süresi"], kategoriler: [konut, arsa, tarla]}
    sale_days_on_market: {id: "{k}_satilik_ilanda_kalma_gun", ad: "{K} satılık ilanda kalma süresi", birim: "gün", esanlam: [], kategoriler: [konut, arsa]}
    rent_price_m2:      {id: "konut_kira_m2",        ad: "Konut kiralık m² fiyatı (aylık)", birim: "TL/m²", esanlam: ["kira m2", "kiralık m2", "metrekare kira", "kira fiyatı m2"], kategoriler: [konut]}
    rent_price:         {id: "konut_ort_kira",       ad: "Konut ortalama aylık kira (ilan)", birim: "TL", esanlam: ["kira", "ortalama kira", "aylık kira", "ev kirası"], kategoriler: [konut]}
    rent_listing_count: {id: "konut_kiralik_ilan_sayisi", ad: "Konut kiralık ilan sayısı", birim: "adet", esanlam: ["kiralık ilan sayısı"], kategoriler: [konut], toplanabilir: true}
    rent_avg_area_m2:   {id: "konut_kiralik_ort_alan_m2", ad: "Kiralık konut ortalama alanı", birim: "m²", esanlam: [], kategoriler: [konut]}
    rent_yearly_change: {id: "konut_kira_yillik_degisim", ad: "Konut kira yıllık değişim", birim: "%", esanlam: ["kira artışı", "kira yıllık artış"], kategoriler: [konut], olcek: degisim}
    rent_days_on_market: {id: "konut_kiralik_ilanda_kalma_gun", ad: "Kiralık konut ilanda kalma süresi", birim: "gün", esanlam: [], kategoriler: [konut]}
    gross_rent_yield:   {id: "konut_brut_kira_getirisi", ad: "Konut brüt kira getirisi (yıllık)", birim: "%", esanlam: ["kira getirisi", "brüt getiri", "kira verimi"], kategoriler: [konut], olcek: yuzde_zaten}
    amortization_years: {id: "konut_amortisman_yil", ad: "Konut amortisman süresi", birim: "yıl", esanlam: ["amortisman", "kendini amorti etme süresi"], kategoriler: [konut]}
    avg_building_age:   {id: "konut_ort_bina_yasi",  ad: "Konut ortalama bina yaşı (ilanlar)", birim: "yıl", esanlam: ["bina yaşı", "ortalama bina yaşı"], kategoriler: [konut]}
  katalog_disi:
    # Kanonikte var ama anlamı/ölçeği doğrulanamadığı için agent'a açılmaz (uydurma yorumu önlemek için).
    - {kategori: arsa,  metric: avg_building_age,    neden: "Arsa için bina yaşı kaynakta böyle etiketli; anlamı belirsiz"}
    - {kategori: arsa,  metric: stock_change_rate,   neden: "Değerlerin tamamına yakını 0; ölçü doğrulanamadı"}
    - {kategori: tarla, metric: stock_change_rate,   neden: "Değerlerin tamamına yakını 0; ölçü doğrulanamadı"}
    - {kategori: arsa,  metric: yearly_stock_change, neden: "Ölçek (oran mı yüzde mi) doğrulanamadı"}
    - {kategori: tarla, metric: yearly_stock_change, neden: "Ölçek (oran mı yüzde mi) doğrulanamadı"}

olcek_kurallari:
  # KANIT (2026-09-28 ölçümü): aynı ölçü farklı kaynak tablolarda farklı ölçekte yazılmış, birim etiketi hepsinde 'ratio'.
  #   stg_ej_region_index: yearly_change medyan 27,58 (yüzde puanı); stg_land_trend_monthly: 0,52 (kesir).
  #   Aynı hücre örneği: GEO_ILCE_000050 konut yearly_change 2026-08 → -0,2148 (stg_price_summary) ve -21,48 (stg_ej_region_index).
  #   gross_rent_yield tüm tablolarda yüzde (medyan 6,5) ama etiketi 'ratio'.
  degisim:
    varsayilan_carpan: 100          # kesir → yüzde
    tablo_carpani: {stg_ej_region_index: 1}   # zaten yüzde
  yuzde_zaten:
    varsayilan_carpan: 1

